    // 9. CLOTH AUTO-SENSING CHOREOGRAPHY, CAMERA PRESETS & UI WIRING
    // =========================================================================
    function transitionCameraTo(presetKey) {
      const preset = CAMERA_PRESETS[presetKey];
      if (!preset) return;

      camTransition.active = true;
      camTransition.startTime = clock.getElapsedTime();
      camTransition.fromPos.copy(camera.position);
      camTransition.toPos.copy(preset.pos);
      camTransition.fromTarget.copy(controls.target);
      camTransition.toTarget.copy(preset.target);

      document.querySelectorAll('.cam-preset-btn').forEach((btn) => {
        btn.classList.toggle('preset-active', btn.dataset.preset === presetKey);
      });
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('status-toast');
      toast.textContent = msg;
      toast.style.opacity = '1';
      toast.style.transform = 'translate(-50%, 0)';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 8px)';
      }, 2600);
    }

    /**
     * Initiates sliding a selected cloth beneath the soleplate sensor for automatic detection.
     */
    function placeClothUnderSensor(clothIndex) {
      // Clicking the already-active cloth removes it cleanly
      if (state.activeClothIndex === clothIndex && state.phase !== 'sliding_out' && state.pendingClothIndex === null) {
        removeClothFromSensor();
        return;
      }

      // Automatically power on Smart Iron if currently OFF
      if (!state.powerOn) {
        state.powerOn = true;
        state.targetPowerFactor = 1.0;
      }

      // If another cloth is currently under the iron, smoothly slide it out first then bring in the new one
      if (state.activeClothIndex !== null && state.clothSlideZ < 2.2) {
        state.pendingClothIndex = clothIndex;
        state.phase = 'sliding_out';
        state.phaseTimer = 0.0;
        state.targetIronLiftY = 0.24;
        updateHUD();
        return;
      }

      beginClothSlideIn(clothIndex);
    }

    function beginClothSlideIn(clothIndex) {
      state.activeClothIndex = clothIndex;
      state.pendingClothIndex = null;
      state.phase = 'sliding_in';
      state.phaseTimer = 0.0;
      state.clothSlideZ = 2.8;
      state.targetIronLiftY = 0.24;

      if (clothMesh && clothGroup) {
        clothMesh.material = clothMaterials[clothIndex];
        clothGroup.position.z = 2.8;
        clothGroup.visible = true;
      }

      updateOledCanvas(clock ? clock.getElapsedTime() : 0);
      updateHUD();
    }

    /**
     * Slides the current cloth out from under the soleplate and resets the iron to Auto-Sense Ready.
     */
    function removeClothFromSensor() {
      if (state.activeClothIndex === null && state.phase === 'standby') return;

      state.pendingClothIndex = null;
      state.phase = 'sliding_out';
      state.phaseTimer = 0.0;
      state.targetIronLiftY = 0.0;
      updateOledCanvas(clock ? clock.getElapsedTime() : 0);
      updateHUD();
    }

    /**
     * Synchronizes Smart Power indicator, 3 cloth buttons, Remove Cloth button, and sensor readout pill.
     */
    function updateHUD() {
      const powerBtn = document.getElementById('btn-power');
      const thumb = document.getElementById('power-thumb');
      const statusText = document.getElementById('power-status-text');
      const readout = document.getElementById('hud-temp-readout');
      const removeBtn = document.getElementById('btn-remove-cloth');

      const cloth = state.activeClothIndex !== null ? CLOTH_TYPES[state.activeClothIndex] : null;
      const hasClothActive = state.activeClothIndex !== null && state.phase !== 'sliding_out';

      // Show/hide compact Remove Cloth button
      removeBtn.classList.toggle('hidden', !hasClothActive);

      // Update the 3 cloth buttons
      document.querySelectorAll('.cloth-select-btn').forEach((btn, idx) => {
        const badgeEl = btn.querySelector('.cloth-right-badge');
        const c = CLOTH_TYPES[idx];
        const isSelected = state.activeClothIndex === idx && state.phase !== 'sliding_out';
        const isScanningThis = isSelected && (state.phase === 'sliding_in' || state.phase === 'scanning');
        const isLockedThis = isSelected && state.phase === 'locked';

        btn.classList.remove('mode-btn-active', 'mode-btn-scanning', 'text-slate-300');
        if (isScanningThis) {
          btn.classList.add('mode-btn-scanning');
          badgeEl.textContent = 'Sensing...';
          badgeEl.className = 'cloth-right-badge font-mono text-[10.5px] text-cyan-300 font-semibold';
        } else if (isLockedThis) {
          btn.classList.add('mode-btn-active');
          badgeEl.textContent = `${c.temp}°C`;
          badgeEl.className = 'cloth-right-badge font-mono text-[11px] px-1.5 py-0.5 rounded-md bg-sky-400/20 text-sky-200 font-semibold border border-sky-300/35';
        } else {
          btn.classList.add('text-slate-300');
          badgeEl.textContent = c.weightTag;
          badgeEl.className = 'cloth-right-badge text-[10.5px] text-slate-400 font-medium';
        }
      });

      if (!state.powerOn) {
        powerBtn.classList.add('bg-slate-700');
        powerBtn.classList.remove('bg-sky-500', 'shadow-[0_0_14px_rgba(14,165,233,0.5)]');
        thumb.style.transform = 'translateX(0px)';
        statusText.textContent = 'Standby · Powered Off';
        statusText.className = 'text-[10.5px] text-slate-400 font-medium mt-0.5 truncate';
        readout.textContent = 'OFF';
        readout.className = 'font-mono text-[10.5px] font-semibold px-2 py-0.5 rounded-full bg-slate-800/70 border border-white/10 text-slate-500 whitespace-nowrap';
        return;
      }

      powerBtn.classList.remove('bg-slate-700');
      powerBtn.classList.add('bg-sky-500', 'shadow-[0_0_14px_rgba(14,165,233,0.5)]');
      thumb.style.transform = 'translateX(24px)';

      if (state.phase === 'sliding_in' || state.phase === 'scanning') {
        statusText.textContent = 'Scanning fabric under sensor...';
        statusText.className = 'text-[10.5px] text-cyan-300 font-medium mt-0.5 truncate';
        readout.textContent = 'Scanning...';
        readout.className = 'font-mono text-[10.5px] font-semibold px-2 py-0.5 rounded-full bg-cyan-500/20 border border-cyan-300/45 text-cyan-200 whitespace-nowrap';
      } else if (state.phase === 'locked' && cloth) {
        statusText.textContent = `Active · Auto: ${cloth.temp}°C ${cloth.label}`;
        statusText.className = 'text-[10.5px] text-sky-400 font-medium mt-0.5 truncate';
        readout.textContent = `${Math.round(state.displayedTemp)}°C`;
        readout.className = 'font-mono text-[10.5px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-400/35 text-emerald-300 whitespace-nowrap';
      } else {
        statusText.textContent = 'Active · Auto-Sense Ready';
        statusText.className = 'text-[10.5px] text-sky-400 font-medium mt-0.5 truncate';
        readout.textContent = 'Auto-Sense';
        readout.className = 'font-mono text-[10.5px] font-semibold px-2 py-0.5 rounded-full bg-sky-500/15 border border-sky-400/30 text-sky-300 whitespace-nowrap';
      }
    }

    function setToggleStyle(btnId, dotId, active) {
      const btn = document.getElementById(btnId);
      const dot = document.getElementById(dotId);
      if (active) {
        btn.className = 'viewport-toggle rounded-xl px-2.5 py-2 text-[11px] font-medium border border-sky-400/40 bg-sky-500/15 hover:bg-sky-500/20 text-sky-200 flex items-center justify-center gap-1.5 transition';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-sky-400 shadow-[0_0_6px_#38bdf8]';
      } else {
        btn.className = 'viewport-toggle rounded-xl px-2.5 py-2 text-[11px] font-medium border border-white/10 bg-white/[0.04] hover:bg-white/[0.09] text-slate-200 flex items-center justify-center gap-1.5 transition';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-slate-500';
      }
    }

    function initUIControls() {
      // Populate the 3 cloth buttons (Silk, Cotton, Linen)
      const clothContainer = document.getElementById('cloth-selector');
      clothContainer.innerHTML = '';

      CLOTH_TYPES.forEach((cloth, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.clothIndex = String(index);
        btn.className = 'cloth-select-btn w-full px-3 py-2.5 rounded-xl border border-white/10 bg-white/[0.03] hover:bg-white/[0.07] text-left flex items-center justify-between transition text-slate-300';
        btn.innerHTML = `
          <span class="flex items-center gap-2.5">
            <span class="swatch-dot w-4 h-4 rounded-full border border-white/30 shadow-inner shrink-0" style="background-color:${cloth.colorHex};"></span>
            <span class="text-xs font-medium">${cloth.label}</span>
          </span>
          <span class="cloth-right-badge text-[10.5px] text-slate-400 font-medium">${cloth.weightTag}</span>
        `;
        btn.addEventListener('click', () => {
          placeClothUnderSensor(index);
        });
        clothContainer.appendChild(btn);
      });

      // Remove Cloth button
      document.getElementById('btn-remove-cloth').addEventListener('click', () => {
        removeClothFromSensor();
      });

      // Smart Power Toggle
      document.getElementById('btn-power').addEventListener('click', () => {
        state.powerOn = !state.powerOn;
        state.targetPowerFactor = state.powerOn ? 1.0 : 0.0;
        if (state.powerOn && state.activeClothIndex !== null && state.phase === 'locked') {
          // Re-verify cloth on power-up
          state.phase = 'scanning';
          state.phaseTimer = 0.0;
        }
        updateHUD();
      });

      // Steam Burst
      document.getElementById('btn-steam').addEventListener('click', () => {
        triggerSteamBurst(1.0, false);
      });

      // Feature Callouts Toggle
      document.getElementById('btn-callouts').addEventListener('click', () => {
        state.showCallouts = !state.showCallouts;
        document.getElementById('callout-layer').classList.toggle('hidden', !state.showCallouts);
        setToggleStyle('btn-callouts', 'dot-callouts', state.showCallouts);
        updateCalloutsOverlay();
      });

      // Auto-Rotate Toggle
      document.getElementById('btn-autorotate').addEventListener('click', () => {
        state.autoRotate = !state.autoRotate;
        controls.autoRotate = state.autoRotate;
        setToggleStyle('btn-autorotate', 'dot-autorotate', state.autoRotate);
      });

      // Wireframe Toggle
      document.getElementById('btn-wireframe').addEventListener('click', () => {
        state.wireframe = !state.wireframe;
        const visited = new Set();
        for (const mesh of allIronMeshes) {
          if (mesh.material && !visited.has(mesh.material)) {
            visited.add(mesh.material);
            mesh.material.wireframe = state.wireframe;
          }
        }
        setToggleStyle('btn-wireframe', 'dot-wireframe', state.wireframe);
      });

      // Studio Floor Toggle
      document.getElementById('btn-floor').addEventListener('click', () => {
        state.showFloor = !state.showFloor;
        studioFloorGroup.visible = state.showFloor;
        setToggleStyle('btn-floor', 'dot-floor', state.showFloor);
      });

      // Camera Presets
      document.querySelectorAll('.cam-preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          transitionCameraTo(btn.dataset.preset);
        });
      });

      // Control Panel Collapse/Expand
      const panelEl = document.getElementById('control-panel');
      const toggleLabel = document.getElementById('panel-toggle-label');
      const syncPanelVisibility = () => {
        panelEl.classList.toggle('hidden', !state.panelOpen);
        toggleLabel.textContent = state.panelOpen ? 'Hide' : 'Controls';
      };
      syncPanelVisibility();

      document.getElementById('btn-toggle-panel').addEventListener('click', () => {
        state.panelOpen = !state.panelOpen;
        syncPanelVisibility();
      });

      updateHUD();
    }

    // =========================================================================
    // 10. INITIALIZATION & RENDER ANIMATION LOOP
    // =========================================================================
    function initScene() {
      const container = document.getElementById('viewport-container');

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.05, 60);
      camera.position.copy(CAMERA_PRESETS.threeQuarter.pos);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.enablePan = false;
      controls.minDistance = 1.55;
      controls.maxDistance = 7.2;
      controls.minPolarAngle = 0.04;
      controls.maxPolarAngle = Math.PI - 0.04;
      controls.autoRotateSpeed = 1.15;
      controls.target.copy(CAMERA_PRESETS.threeQuarter.target);
      controls.update();

      controls.addEventListener('start', () => {
        camTransition.active = false;
      });

      clock = new THREE.Clock();

      initOledDisplayCanvas();
      buildStudioEnvironment();
      buildSmartSteamIron();
      buildClothSwatch();
      initCalloutsOverlay();
      initUIControls();

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCalloutsOverlay();
    }

    let lastOledDrawTime = 0;

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 1. Smoothly interpolate Smart Power state
      state.powerFactor += (state.targetPowerFactor - state.powerFactor) * Math.min(1, dt * 6.5);

      // 2. Auto-Sensing Choreography State Machine
      state.phaseTimer += dt;
      let needsOledUpdate = false;

      if (state.phase === 'sliding_in') {
        const dur = 0.55;
        const t = Math.min(1, state.phaseTimer / dur);
        // Smooth cubic ease-out slide from z = 2.8 -> 0.0
        const easeOut = 1 - Math.pow(1 - t, 3);
        state.clothSlideZ = THREE.MathUtils.lerp(2.8, 0.0, easeOut);
        if (clothGroup) clothGroup.position.z = state.clothSlideZ;
        needsOledUpdate = true;

        if (t >= 1.0) {
          state.phase = 'scanning';
          state.phaseTimer = 0.0;
          updateHUD();
        }
      } else if (state.phase === 'scanning') {
        const scanDur = 0.90;
        needsOledUpdate = true;

        if (state.phaseTimer >= scanDur && state.powerOn) {
          const detected = CLOTH_TYPES[state.activeClothIndex];
          state.phase = 'locked';
          state.phaseTimer = 0.0;
          state.lockFlashTimer = 0.42;
          state.targetIronLiftY = 0.11; // Hover cleanly over cloth ready to iron
          if (state.displayedTemp < 75 || state.displayedTemp > 210) {
            state.displayedTemp = 80;
          }
          state.targetTemp = detected.temp;

          updateHUD();
          showToast(`Detected ${detected.label} — Auto-set to ${detected.temp}°C`);

          // Subtle mini puff of steam on Cotton or Linen lock-in
          if (detected.id === 'cotton' || detected.id === 'linen') {
            triggerSteamBurst(detected.id === 'linen' ? 0.42 : 0.28, true);
          }
        }
      } else if (state.phase === 'locked') {
        // Smoothly count/ramp displayed 7-segment temperature to target
        const diff = state.targetTemp - state.displayedTemp;
        if (Math.abs(diff) > 0.35) {
          state.displayedTemp += diff * Math.min(1, dt * 4.8);
          needsOledUpdate = true;
          const readoutEl = document.getElementById('hud-temp-readout');
          if (readoutEl && state.powerOn) {
            readoutEl.textContent = `${Math.round(state.displayedTemp)}°C`;
          }
        } else if (state.displayedTemp !== state.targetTemp) {
          state.displayedTemp = state.targetTemp;
          needsOledUpdate = true;
          const readoutEl = document.getElementById('hud-temp-readout');
          if (readoutEl && state.powerOn) {
            readoutEl.textContent = `${Math.round(state.displayedTemp)}°C`;
          }
        }
        if (state.lockFlashTimer > 0) {
          state.lockFlashTimer = Math.max(0, state.lockFlashTimer - dt);
        }
      } else if (state.phase === 'sliding_out') {
        const dur = state.pendingClothIndex !== null ? 0.34 : 0.46;
        const t = Math.min(1, state.phaseTimer / dur);
        const easeIn = t * t * (3 - 2 * t);
        state.clothSlideZ = THREE.MathUtils.lerp(0.0, 2.8, easeIn);
        if (clothGroup) clothGroup.position.z = state.clothSlideZ;

        if (t >= 1.0) {
          if (state.pendingClothIndex !== null) {
            const nextIdx = state.pendingClothIndex;
            beginClothSlideIn(nextIdx);
          } else {
            state.activeClothIndex = null;
            state.phase = 'standby';
            state.phaseTimer = 0.0;
            state.displayedTemp = 80;
            state.targetTemp = 80;
            if (clothGroup) clothGroup.visible = false;
            updateOledCanvas(elapsed);
            updateHUD();
          }
        }
      } else {
        // Standby: gentle breathing arc pulse on OLED
        needsOledUpdate = true;
      }

      // Throttle periodic canvas redraws cleanly for smooth 60fps performance
      const drawInterval = state.phase === 'standby' ? 0.08 : 0.038;
      if (needsOledUpdate && elapsed - lastOledDrawTime >= drawInterval) {
        updateOledCanvas(elapsed);
        lastOledDrawTime = elapsed;
      }

      // 3. Smooth Iron Vertical Lift & Subtle Contact Shadow Softening
      state.ironLiftY += (state.targetIronLiftY - state.ironLiftY) * Math.min(1, dt * 6.5);
      if (ironGroup) {
        ironGroup.position.y = state.ironLiftY;
      }
      if (contactShadowMat) {
        contactShadowMat.opacity = THREE.MathUtils.lerp(0.85, 0.48, Math.min(1, state.ironLiftY / 0.24));
      }

      // Subtle living micro-ripple on cloth swatch when visible
      if (clothGroup && clothGroup.visible && clothMesh && clothBasePositions) {
        const pos = clothMesh.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const bx = clothBasePositions[i * 3];
          const by = clothBasePositions[i * 3 + 1];
          const bz = clothBasePositions[i * 3 + 2];
          const flutter = Math.sin(bx * 2.5 + elapsed * 1.6) * Math.cos(bz * 2.4 + elapsed * 1.2) * 0.0022;
          pos.setY(i, by + flutter);
        }
        pos.needsUpdate = true;
      }

      // 4. Bottom Optical Sensor Beam Cone, Reticle, Flash & Underside Lighting
      const isScanning = state.powerOn && state.phase === 'scanning';
      const isLockedActive = state.powerOn && state.phase === 'locked' && state.activeClothIndex !== null;
      const isConfirmFlash = state.lockFlashTimer > 0 && isLockedActive;

      if (sensorBeamMesh && sensorBeamMat && scanReticleMesh && scanReticleMat) {
        const clothTopY = 0.026;
        const beamHeight = Math.max(0.04, state.ironLiftY - clothTopY + 0.005);
        sensorBeamMesh.scale.set(1.0, beamHeight, 1.0);
        sensorBeamMesh.position.y = -beamHeight * 0.5;

        if (sensorBeamMat.map) {
          sensorBeamMat.map.offset.y -= dt * (isScanning ? 2.5 : 0.7);
        }

        const scanPulse = 0.78 + 0.22 * Math.sin(elapsed * 22);
        const targetBeamOp = isScanning
          ? 0.72 * scanPulse
          : isConfirmFlash
            ? 0.65
            : isLockedActive
              ? 0.20 + 0.04 * Math.sin(elapsed * 3.5)
              : 0.0;

        sensorBeamMat.opacity += (targetBeamOp - sensorBeamMat.opacity) * Math.min(1, dt * 11.0);
        sensorBeamMesh.visible = sensorBeamMat.opacity > 0.01;

        // Confirmation flash shifts reticle & beam briefly toward crisp cyan-emerald
        const flashColor = isConfirmFlash ? 0x34f5c5 : 0x22d3ee;
        sensorBeamMat.color.setHex(flashColor);
        scanReticleMat.color.setHex(isConfirmFlash ? 0x4df9c8 : 0x38e8ff);

        const targetReticleOp = isScanning
          ? 0.94
          : isConfirmFlash
            ? 1.0
            : isLockedActive
              ? 0.34
              : 0.0;
        scanReticleMat.opacity += (targetReticleOp - scanReticleMat.opacity) * Math.min(1, dt * 11.0);
        scanReticleMesh.visible = scanReticleMat.opacity > 0.01 && clothGroup.visible;
        scanReticleMesh.rotation.y += dt * (isScanning ? 3.4 : 0.55);

        const retScale = isConfirmFlash
          ? 1.08
          : isScanning
            ? 0.88 + 0.14 * Math.sin(elapsed * 14)
            : 0.78;
        scanReticleMesh.scale.set(retScale, 1, retScale);

        // Micro-LED ring & dual IR diodes glow on soleplate underside
        const ringGlow = state.powerOn
          ? (isScanning ? 4.4 * scanPulse : isConfirmFlash ? 4.8 : isLockedActive ? 2.5 : 1.05 + 0.35 * Math.sin(elapsed * 2.4))
          : 0.0;
        sensorRingMat.emissive.setHex(isConfirmFlash ? 0x10e8a8 : 0x00c8ff);
        sensorRingMat.emissiveIntensity = ringGlow;
        sensorIrMat.emissiveIntensity = ringGlow * 0.85;

        sensorPointLight.color.setHex(isConfirmFlash ? 0x22f5b8 : 0x00ccff);
        sensorPointLight.intensity = isScanning ? 2.8 * scanPulse : isConfirmFlash ? 3.0 : isLockedActive ? 0.95 : 0.0;
      }

      // 5. Animate OLED Emissive Glow & Front Blue LED Tip
      const activeCloth = state.activeClothIndex !== null && state.phase === 'locked'
        ? CLOTH_TYPES[state.activeClothIndex]
        : null;
      const baseLedInt = activeCloth ? activeCloth.ledIntensity : 1.55;
      const baseArc = activeCloth ? activeCloth.arcFrac : 0.42;
      const pulse = 1.0 + 0.06 * Math.sin(elapsed * 3.2);

      if (oledMaterial) {
        oledMaterial.emissiveIntensity = 1.38 * state.powerFactor;
      }
      if (blueLedMaterial && blueLedCoreMaterial && tipPointLight) {
        blueLedMaterial.emissiveIntensity = baseLedInt * state.powerFactor * pulse;
        blueLedCoreMaterial.emissiveIntensity = (baseLedInt * 1.55) * state.powerFactor * pulse;
        tipPointLight.intensity = (0.75 + baseArc * 0.85) * state.powerFactor * pulse;
      }

      // 6. Smooth Cubic Ease-In-Out Camera Preset Animation
      if (camTransition.active) {
        const rawT = Math.min(1, (elapsed - camTransition.startTime) / camTransition.duration);
        const ease = rawT < 0.5 ? 4 * rawT * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 3) / 2;

        camera.position.lerpVectors(camTransition.fromPos, camTransition.toPos, ease);
        controls.target.lerpVectors(camTransition.fromTarget, camTransition.toTarget, ease);

        if (rawT >= 1.0) {
          camTransition.active = false;
        }
      }

      // 7. Update Controls, Steam Particles & Projected Callouts
      controls.update();
      updateSteamParticles(dt);
      updateCalloutsOverlay();

      renderer.render(scene, camera);
    }

    // Start after full window load with graceful error handling
    window.addEventListener('load', () => {
      try {
        initScene();
        animate();
      } catch (err) {
        console.error('3D Studio Initialization Error:', err);
        showToast('WebGL initialization issue detected.');
      }
    });
  </script>
</body>
</html>
